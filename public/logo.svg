  <circle cx="16" cy="16" r="13.6" fill="#212842"/>
  <g transform="translate(16 16) scale(0.52) translate(-24 -24)">
    <rect x="9" y="9" width="12" height="12" rx="3" fill="none" stroke="#dd5410" stroke-width="2.5"/>
    <rect x="13" y="13" width="4" height="4" rx="1" fill="#dd5410"/>
    <rect x="27" y="9" width="12" height="12" rx="3" fill="none" stroke="#dd5410" stroke-width="2.5"/>
    <rect x="31" y="13" width="4" height="4" rx="1" fill="#dd5410"/>
    <rect x="9" y="27" width="12" height="12" rx="3" fill="none" stroke="#dd5410" stroke-width="2.5"/>
    <rect x="13" y="31" width="4" height="4" rx="1" fill="#dd5410"/>
    <rect x="27" y="27" width="4" height="4" rx="1" fill="#dd5410"/>
    <rect x="35" y="27" width="4" height="4" rx="1" fill="#eb9c74"/>
    <rect x="27" y="35" width="4" height="4" rx="1" fill="#eb9c74"/>
    <rect x="35" y="35" width="4" height="4" rx="1" fill="#dd5410"/>
