<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- Self-hosted font (@font-face in src/styles/fonts.css). Preload both scripts: the console is Russian with
         Latin slugs and URLs on every screen, so the first paint needs both files. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-cyrillic.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- A management console behind a login: it has nothing to offer a crawler and should not be findable. The
         social and structured-data tags below are for link previews and the browser, not for search. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Management console of Pathfinder by 84softworks: QR codes that send every device to the right place – App Store, Google Play, AppGallery or the website – with per-platform scan statistics."
    />
    <meta name="application-name" content="Pathfinder Console" />
    <meta name="apple-mobile-web-app-title" content="Pathfinder" />
    <link rel="canonical" href="https://pathfinder-console.84softworks.com/" />

    <!-- Favicons / app icons: one round mark everywhere (dark disc inside a cyan ring, the QR finder pattern),
         transparent corners. The ring lifts the contrast so Safari does not paint its white "low-contrast" card
         behind the dark disc. favicon.ico is BMP-encoded (16/32/48), NOT PNG-in-ICO, which Safari's ICO decoder
         cannot read. The 96x96 PNG is the size Google and link previews pick up. apple-touch stays an opaque
         square that iOS masks to a squircle. ?v= busts the very sticky favicon cache when the art changes - bump
         it on the next icon edit. Generated by brand/make_icons.py (kept outside this repository). -->
    <link rel="icon" href="/favicon.ico?v=1" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph: what a messenger shows when the console link is pasted. Absolute addresses by the protocol;
         change them together with the canonical when the console lives on another name. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pathfinder" />
    <meta property="og:title" content="Pathfinder Console" />
    <meta property="og:description" content="Management console of Pathfinder by 84softworks – one QR code, the right store for every device." />
    <meta property="og:url" content="https://pathfinder-console.84softworks.com/" />
    <meta property="og:image" content="https://pathfinder-console.84softworks.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pathfinder by 84softworks – one QR code, the right store for every device" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pathfinder Console" />
    <meta name="twitter:description" content="Management console of Pathfinder by 84softworks – one QR code, the right store for every device." />
    <meta name="twitter:image" content="https://pathfinder-console.84softworks.com/og-image.png" />

    <!-- Structured data: the site name for browsers and previews, and the organization behind the product -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pathfinder Console",
        "url": "https://pathfinder-console.84softworks.com/",
        "publisher": { "@type": "Organization", "name": "84softworks", "url": "https://84softworks.com/" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "84softworks",
        "url": "https://84softworks.com/",
        "logo": "https://84softworks.com/favicon-96x96.png",
        "founder": { "@type": "Person", "name": "Andrei Baranov", "url": "https://github.com/beiroun" }
      }
    </script>

    <title>Pathfinder Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
